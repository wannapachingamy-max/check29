<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 ตรวจสอบสถานะคิวพาสเทล 🌸</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;700&display=swap">
    <style>
        @keyframes bubbleIn {
            0% { transform: scale(0.5) translateY(50px); opacity: 0; }
            60% { transform: scale(1.08) translateY(-10px); }
            80% { transform: scale(0.95) translateY(5px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes toastPop {
            0% { transform: scale(0.7) translateY(-30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        body {
            background-color: #FDFBF7;
            background-image: radial-gradient(#FFD1DC 1px, transparent 1px), radial-gradient(#B5E2FA 1px, #FDFBF7 1px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            font-family: 'Mitr', sans-serif;
            color: #4A4744;
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: #FFFFFF;
            padding: 40px 30px;
            border-radius: 35px;
            /* เส้นขอบหนาแบบพาสเทลชิคๆ */
            border: 4px solid #6D675E; 
            /* เงา 3D แบบนุ่มนวล */
            box-shadow: 8px 8px 0px #6D675E, 0px 15px 30px rgba(0,0,0,0.05);
            animation: bubbleIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            text-align: center;
            color: #FF9AA2;
            font-size: 36px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px #6D675E;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #8CB369;
            margin-bottom: 40px;
            font-size: 16px;
            background: #EDF7E7;
            display: table;
            margin-left: auto;
            margin-right: auto;
            padding: 6px 20px;
            border-radius: 20px;
            border: 2px solid #6D675E;
        }

        /* ปรับดีไซน์ตารางใหม่ ไม่ให้เป็นตารางจืดๆ */
        .queue-list-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .queue-card-header {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: #8C8780;
            font-size: 14px;
            font-weight: 500;
        }

        .queue-card {
            background: #FAF8F5;
            border: 3px solid #6D675E;
            border-radius: 22px;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 4px 4px 0px #6D675E;
            transition: all 0.2s ease;
        }

        .queue-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #6D675E;
            background: #FFF;
        }

        .queue-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .queue-number {
            background: #FFDAC1;
            border: 2px solid #6D675E;
            color: #6D523E;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 2px 2px 0px #6D675E;
        }

        .customer-name {
            font-size: 18px;
            font-weight: 500;
            color: #4A4744;
        }

        .queue-time {
            font-size: 12px;
            color: #A39E98;
            margin-top: 4px;
        }

        /* ปุ่มสเตตัสอวบอิ่มเหมือนเยลลี่ 🟦🟫🟩🟥🩷 */
        .status-badge {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 2px solid #6D675E;
            box-shadow: 3px 3px 0px #6D675E;
            text-align: center;
        }
        .status-working { background-color: #B5E2FA; color: #2B5973; }
        .status-brief { background-color: #E6CCB2; color: #5D4037; }
        .status-paid { background-color: #C5E1A5; color: #33691E; }
        .status-pending { background-color: #FFB7B2; color: #7A3E3E; }
        .status-done { background-color: #FFC6FF; color: #5C235C; }

        /* ระบบกล่องสเตตัสเด้งสุดคิ้วท์ */
        .toast-container {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9999;
        }
        .toast {
            background: #FFFFFF;
            padding: 16px 25px;
            border-radius: 20px;
            border: 3px solid #6D675E;
            box-shadow: 5px 5px 0px #6D675E;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toast-box"></div>

    <div class="container">
        <h1>🌸 ตรวจสอบสถานะคิว 🌸</h1>
        <p class="subtitle">มาเช็คสถานะงานแบบดึ๋งๆ กันเลยน้า~</p>

        <div class="queue-card-header">
            <span>ข้อมูลลูกค้า</span>
            <span>สถานะปัจจุบัน</span>
        </div>

        <div class="queue-list-container" id="customer-queue-box">
            <!-- ข้อมูลคิวจะแปลงร่างเป็นกล่องขนมปังตรงนี้ -->
        </div>
    </div>

    <script>
        function showToast(message) {
            const container = document.getElementById('toast-box');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `🎈 <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function getStatusConfig(status) {
            switch(status) {
                case 'working': return { class: 'status-working', text: 'กำลังทำ 🟦' };
                case 'brief': return { class: 'status-brief', text: 'รอบรีฟ 🟫' };
                case 'paid': return { class: 'status-paid', text: 'จ่ายเงินแล้ว 🟩' };
                case 'pending': return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
                case 'done': return { class: 'status-done', text: 'เสร็จแล้ว 🩷' };
                default: return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
            }
        }

        function renderCustomerCards() {
            const queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];
            const box = document.getElementById('customer-queue-box');
            box.innerHTML = '';

            if (queueData.length === 0) {
                box.innerHTML = `<div style="text-align:center; color:#A39E98; padding: 40px; background:#FAF8F5; border:3px dashed #6D675E; border-radius:22px;">ยังไม่มีรายการคิวเลยน้า~ ไว้มาดูใหม่นะคิ้วท์เบบี้ 🐰</div>`;
                return;
            }

            queueData.forEach((item, index) => {
                const statusInfo = getStatusConfig(item.status);
                box.innerHTML += `
                    <div class="queue-card">
                        <div class="queue-info">
                            <div class="queue-number">${index + 1}</div>
                            <div>
                                <div class="customer-name">${item.name}</div>
                                <div class="queue-time">🕒 ${item.time}</div>
                            </div>
                        </div>
                        <div class="status-badge ${statusInfo.class}">${statusInfo.text}</div>
                    </div>
                `;
            });
        }

        renderCustomerCards();
        
        window.addEventListener('storage', (e) => {
            if(e.key === 'pastel_queues') {
                renderCustomerCards();
                showToast('คิวอัปเดตแล้วจ้าดึ๋งๆ! ✨');
            }
        });
    </script>
</body>
</html>
