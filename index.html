<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy.mkt - Queue Status</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;600;700&display=swap">
    <style>
        body {
            background-color: #FDFBF9;
            font-family: 'Kanit', sans-serif;
            color: #4A4A4A;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px; /* ขยายความกว้างเพื่อรองรับ Layout การ์ดคู่แบบในรูป */
            margin: 0 auto;
        }

        /* 👑 Brand Header ส่วนบนสุด */
        .brand-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .brand-info { display: flex; align-items: center; gap: 15px; }
        .brand-logo { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; }
        .brand-title-wrap h1 { font-family: 'Poppins', sans-serif; color: #FF7E1F; font-size: 24px; margin: 0; font-weight: 700; }
        .brand-title-wrap p { margin: 4px 0 0 0; font-size: 13px; color: #888; }
        .queue-badge-top { background: #FFF2E8; color: #FF7E1F; padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 500; }

        /* 📢 ส่วนหัวข้อประกาศข่าวสาร (ถอดแบบภาพ image_19c30c.jpg) */
        .news-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        .news-title-block { display: flex; align-items: center; gap: 12px; }
        .news-icon-bg {
            background: #FF7E1F; color: white; width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 18px;
            box-shadow: 0 4px 10px rgba(255, 126, 31, 0.2);
        }
        .news-main-title { font-size: 22px; font-weight: 600; color: #1A1A1A; display: flex; align-items: center; gap: 8px; }
        .live-badge { background: #E8F5E9; color: #2ECC71; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .news-subtitle { font-size: 13px; color: #8A8A8A; margin-top: 4px; font-weight: 400; }
        
        .btn-view-all {
            background: #FF7E1F; color: white; border: none; padding: 10px 20px; 
            border-radius: 25px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(255, 126, 31, 0.2);
        }

        /* 🗂️ Grid Layout การ์ดข่าวสารสองฝั่ง */
        .announcements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        @media (max-width: 1024px) {
            .announcements-grid { grid-template-columns: 1fr; }
        }

        /* ดีไซน์การ์ดเลียนแบบ Facebook/GaFiwSHOP */
        .news-card {
            background: #FFFFFF;
            border: 1px solid #EAEAEA;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.015);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .news-card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.04); }

        .card-top-profile { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .profile-info { display: flex; align-items: center; gap: 12px; }
        .profile-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #FF7E1F; object-fit: cover; }
        .profile-name { font-weight: 600; color: #222; font-size: 15px; display: flex; align-items: center; gap: 4px; }
        .verified-tick { color: #1E88E5; font-size: 14px; }
        .post-time { font-size: 12px; color: #999; margin-top: 2px; }
        
        /* สไตล์ Badge ตามประเภทที่แอดมินเลือก */
        .type-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
        .badge-promo { background: #FFF0F0; color: #E53935; }
        .badge-maintenance { background: #FFFDE7; color: #F57F17; }
        .badge-general { background: #E3F2FD; color: #1E88E5; }

        .card-body-text { font-size: 14.5px; color: #444; line-height: 1.6; margin-bottom: 15px; font-weight: 400; }
        .read-more { color: #FF7E1F; font-weight: 500; cursor: pointer; text-decoration: none; display: block; margin-top: 5px; }

        .card-media-wrap { width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid #ECEFF1; margin-bottom: 15px; }
        .card-img { width: 100%; max-height: 240px; object-fit: cover; display: block; }

        .card-footer-actions {
            border-top: 1px solid #F0F2F5; padding-top: 12px; display: flex; justify-content: center; align-items: center;
        }
        .like-btn { background: none; border: none; color: #65676B; font-family: 'Kanit'; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .like-btn:hover { color: #FF7E1F; }

        /* ส่วนแสดงคิวงานด้านล่าง */
        .queue-header-title { font-size: 18px; font-weight: 600; color: #222; margin: 40px 0 15px 0; padding-left: 5px; }
        .queue-list-container { display: flex; flex-direction: column; gap: 12px; }
        .queue-card-header { display: flex; justify-content: space-between; padding: 0 15px; color: #8C8C8C; font-size: 13px; font-weight: 500; }
        .queue-card {
            background: #FFFFFF; border: 1px solid #ECEFF1; border-radius: 16px; padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.01);
        }
        .queue-info { display: flex; align-items: center; gap: 16px; }
        .queue-number { background: #FFF2E8; color: #FF7E1F; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; font-size: 14px; }
        .customer-name { font-size: 15px; font-weight: 500; color: #2D2D2D; }
        .queue-time { font-size: 12px; color: #A0A0A0; margin-top: 2px; }
        .status-badge { padding: 6px 16px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .status-working { background-color: #E3F2FD; color: #1E88E5; }
        .status-brief { background-color: #EFEBE9; color: #6D4C41; }
        .status-paid { background-color: #E8F5E9; color: #43A047; }
        .status-pending { background-color: #FFEBEE; color: #E53935; }
        .status-done { background-color: #F3E5F5; color: #8E24AA; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนบน: หัวข้อร้าน -->
        <div class="brand-section">
            <div class="brand-info">
                <img class="brand-logo" src="gkibotlrgpwer.jfif" alt="Logo">
                <div class="brand-title-wrap">
                    <h1>Tummy.mkt</h1>
                    <p>ระบบติดตามสถานะคิวงานแบบ Real-time</p>
                </div>
            </div>
            <div class="queue-badge-top">🎯 ตรวจสอบคิวของคุณได้ที่นี่</div>
        </div>

        <!-- ส่วนกลาง: หัวข้อประกาศแบบจำลองจากภาพตัวอย่าง -->
        <div class="news-section-header">
            <div class="news-title-block">
                <div class="news-icon-bg">📢</div>
                <div>
                    <div class="news-main-title">ประกาศข่าวสาร <span class="live-badge">● Live</span></div>
                    <div class="news-subtitle">อัปเดตข่าวสาร โปรโมชัน และประกาศสำคัญจากทางร้าน</div>
                </div>
            </div>
            <a href="#" class="btn-view-all">ดูทั้งหมด ➔</a>
        </div>

        <!-- 📢 ฟีดบอร์ดแสดงประกาศข่าวสารคู่ขนาน -->
        <div class="announcements-grid" id="announcements-feed-box">
            <!-- ข้อมูลจะโหลดการ์ดดีไซน์เฟซบุ๊กมาแสดงตรงนี้ -->
        </div>

        <!-- ส่วนล่าง: ตารางคิวงาน -->
        <div class="queue-header-title">📋 ลำดับคิวงานปัจจุบัน</div>
        <div class="queue-card-header">
            <span>ข้อมูลลูกค้า</span>
            <span>สถานะปัจจุบัน</span>
        </div>
        <div class="queue-list-container" id="customer-queue-box"></div>
    </div>

    <script>
        function loadAnnouncements() {
            const announceData = JSON.parse(localStorage.getItem('tummy_announcements')) || [];
            const feedBox = document.getElementById('announcements-feed-box');
            feedBox.innerHTML = '';

            if (announceData.length === 0) {
                // ค่าเริ่มต้นหากยังไม่มีการตั้งประกาศ
                feedBox.innerHTML = `
                    <div class="news-card" style="grid-column: 1 / -1; text-align: center; color: #888; padding: 40px 20px;">
                        ยังไม่มีประกาศข่าวสารในขณะนี้ 🧡
                    </div>
                `;
                return;
            }

            // แสดงประกาศเรียงจากใหม่ไปเก่า
            announceData.slice().reverse().forEach(item => {
                let imgHTML = item.img ? `<div class="card-media-wrap"><img class="card-img" src="${item.img}"></div>` : '';
                
                // คัดแยกสไตล์ตามประเภทแท็ก
                let badgeClass = "badge-general";
                let badgeText = "📌 ทั่วไป";
                if(item.type === "promo") { badgeClass = "badge-promo"; badgeText = "🔥 โปรโมชัน"; }
                if(item.type === "maintenance") { badgeClass = "badge-maintenance"; badgeText = "🛠️ ปิดปรับปรุง"; }

                feedBox.innerHTML += `
                    <div class="news-card">
                        <div>
                            <div class="card-top-profile">
                                <div class="profile-info">
                                    <img class="profile-avatar" src="gkibotlrgpwer.jfif" alt="Admin">
                                    <div>
                                        <div class="profile-name">Tummy.mkt แอดมิน <span class="verified-tick">✓</span></div>
                                        <div class="post-time">${item.date || 'เมื่อสักครู่ที่ผ่านมา'} • 🌐</div>
                                    </div>
                                </div>
                                <span class="type-badge ${badgeClass}">${badgeText}</span>
                            </div>
                            
                            <div class="card-body-text">
                                ${item.text}
                                <span class="read-more">ดูเพิ่มเติม</span>
                            </div>
                            
                            ${imgHTML}
                        </div>

                        <div class="card-footer-actions">
                            <button class="like-btn">👍 ถูกใจ</button>
                        </div>
                    </div>
                `;
            });
        }

        function getStatusConfig(status) {
            switch(status) {
                case 'working': return { class: 'status-working', text: 'กำลังทำ 🟦' };
                case 'brief': return { class: 'status-brief', text: 'รอบรีฟ 🟫' };
                case 'paid': return { class: 'status-paid', text: 'จ่ายเงินแล้ว 🟩' };
                case 'pending': return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
                case 'done': return { class: 'status-done', text: 'เสร็จแล้ว 🩷' };
                default: return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
            }
        }

        function renderCustomerCards() {
            const queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];
            const box = document.getElementById('customer-queue-box');
            box.innerHTML = '';

            if (queueData.length === 0) {
                box.innerHTML = `<div style="text-align:center; color:#A0A0A0; padding: 30px; background:white; border:1px dashed #E0E0E0; border-radius:16px; font-size:14px;">ยังไม่มีรายการคิวในขณะนี้</div>`;
                return;
            }

            queueData.forEach((item, index) => {
                const statusInfo = getStatusConfig(item.status);
                box.innerHTML += `
                    <div class="queue-card">
                        <div class="queue-info">
                            <div class="queue-number">${index + 1}</div>
                            <div>
                                <div class="customer-name">${item.name}</div>
                                <div class="queue-time">🕒 ${item.time}</div>
                            </div>
                        </div>
                        <div class="status-badge ${statusInfo.class}">${statusInfo.text}</div>
                    </div>
                `;
            });
        }

        loadAnnouncements();
        renderCustomerCards();

        window.addEventListener('storage', (e) => { 
            if(e.key === 'pastel_queues') renderCustomerCards(); 
            if(e.key === 'tummy_announcements') loadAnnouncements();
        });
    </script>
</body>
</html>
