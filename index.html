<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy.mkt - Queue Status</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;600;700&display=swap">
    <style>
        body {
            background-color: #F8F9FA;
            font-family: 'Kanit', 'Poppins', sans-serif;
            color: #4A4A4A;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            gap: 12px;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(255, 126, 31, 0.15);
        }

        h1 {
            font-family: 'Poppins', 'Kanit', sans-serif;
            text-align: center;
            color: #FF7E1F;
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            color: #FF7E1F;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 500;
            background: #FFF2E8;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 30px;
        }

        .brand-container-wrapper {
            text-align: center;
        }

        /* 📢 แทบประกาศข่าวสาร ถอดดีไซน์จาก Screenshot (23).jpg */
        .announcement-bar {
            background: #FFF2E8; /* พื้นหลังส้ม-ครีมนวล */
            border: 1px solid #FFE0CC;
            border-radius: 14px;
            padding: 14px 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .announce-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .announce-icon {
            background: #FF7E1F;
            color: white;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .announce-text-wrapper {
            display: flex;
            flex-direction: column;
        }

        .announce-tag {
            font-size: 14px;
            font-weight: 600;
            color: #FF7E1F;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .announce-live-dot {
            width: 8px;
            height: 8px;
            background-color: #2ECC71;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .announce-message {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
            line-height: 1.4;
        }

        .announce-btn {
            background: #FF7E1F;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .announce-btn:hover {
            background: #E06613;
        }

        /* ส่วนของรายการคิว */
        .queue-list-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .queue-card-header {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            color: #8C8C8C;
            font-size: 13px;
            font-weight: 500;
        }

        .queue-card {
            background: #FFFFFF;
            border: 1px solid #ECEFF1;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.015);
            transition: all 0.2s ease-in-out;
        }

        .queue-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
            border-color: #FF7E1F;
        }

        .queue-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .queue-number {
            background: #FFF2E8;
            color: #FF7E1F;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 600;
            font-size: 15px;
        }

        .customer-name {
            font-size: 16px;
            font-weight: 500;
            color: #2D2D2D;
        }

        .queue-time {
            font-size: 12px;
            color: #A0A0A0;
            margin-top: 2px;
        }

        .status-badge {
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-working { background-color: #E3F2FD; color: #1E88E5; }
        .status-brief { background-color: #EFEBE9; color: #6D4C41; }
        .status-paid { background-color: #E8F5E9; color: #43A047; }
        .status-pending { background-color: #FFEBEE; color: #E53935; }
        .status-done { background-color: #F3E5F5; color: #8E24AA; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-container-wrapper">
            <div class="brand-header">
                <img class="brand-logo" src="https://api.dicebear.com/7.x/kaisei/svg?seed=Tummy" alt="Tummy.mkt Logo">
                <h1>Tummy.mkt</h1>
            </div>
            <div class="subtitle">🎯 ตรวจสอบสถานะคิวงานล่าสุด</div>
        </div>

        <!-- 📢 แถบประกาศข่าวสาร (ดึงข้อมูลมาจากระบบแอดมินอัตโนมัติ) -->
        <div class="announcement-bar" id="announcement-zone">
            <div class="announce-content">
                <div class="announce-icon">📢</div>
                <div class="announce-text-wrapper">
                    <span class="announce-tag">ประกาศข่าวสาร <span class="announce-live-dot"></span></span>
                    <span class="announce-message" id="announcement-text">กำลังโหลดประกาศล่าสุดจากร้าน...</span>
                </div>
            </div>
            <a href="#" class="announce-btn">ดูเพิ่มเติม ➔</a>
        </div>

        <div class="queue-card-header">
            <span>ข้อมูลลูกค้า</span>
            <span>สถานะปัจจุบัน</span>
        </div>

        <div class="queue-list-container" id="customer-queue-box">
            <!-- คิวจะแสดงตรงนี้ -->
        </div>
    </div>

    <script>
        // ฟังก์ชันโหลดประกาศข่าวสาร
        function loadAnnouncement() {
            const currentAnnounce = localStorage.getItem('tummy_announcement') || 'ยินดีต้อนรับสู่ Tummy.mkt! สามารถเช็คคิวงานปัจจุบันของตัวเองได้เลยน้า 🧡';
            document.getElementById('announcement-text').innerText = currentAnnounce;
        }

        function getStatusConfig(status) {
            switch(status) {
                case 'working': return { class: 'status-working', text: 'กำลังทำ 🟦' };
                case 'brief': return { class: 'status-brief', text: 'รอบรีฟ 🟫' };
                case 'paid': return { class: 'status-paid', text: 'จ่ายเงินแล้ว 🟩' };
                case 'pending': return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
                case 'done': return { class: 'status-done', text: 'เสร็จแล้ว 🩷' };
                default: return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
            }
        }

        function renderCustomerCards() {
            const queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];
            const box = document.getElementById('customer-queue-box');
            box.innerHTML = '';

            if (queueData.length === 0) {
                box.innerHTML = `<div style="text-align:center; color:#A0A0A0; padding: 40px; background:#FAFAFA; border:1px dashed #E0E0E0; border-radius:16px; font-size:14px;">ยังไม่มีรายการคิวในขณะนี้</div>`;
                return;
            }

            queueData.forEach((item, index) => {
                const statusInfo = getStatusConfig(item.status);
                box.innerHTML += `
                    <div class="queue-card">
                        <div class="queue-info">
                            <div class="queue-number">${index + 1}</div>
                            <div>
                                <div class="customer-name">${item.name}</div>
                                <div class="queue-time">🕒 ${item.time}</div>
                            </div>
                        </div>
                        <div class="status-badge ${statusInfo.class}">${statusInfo.text}</div>
                    </div>
                `;
            });
        }

        // เริ่มทำงานครั้งแรก
        loadAnnouncement();
        renderCustomerCards();

        // ตรวจจับการอัปเดตข้ามหน้าต่างเว็บแบบเรียลไทม์
        window.addEventListener('storage', (e) => { 
            if(e.key === 'pastel_queues') renderCustomerCards(); 
            if(e.key === 'tummy_announcement') loadAnnouncement();
        });
    </script>
</body>
</html>
