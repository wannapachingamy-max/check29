<!DOCTYPE html>
<html lang="th">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Tummy.mkt - Queue Status 🌸</title>
    <!-- เพิ่มฟอนต์สไตล์น่ารักป๊อปๆ ดึงเข้าโปรเจกต์โดยตรง -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mitr:wght@400;500;700&display=swap">
    <style>
        body {
            background-color: #FAF6F0;
            background-image: radial-gradient(#FFC2D1 1.5px, transparent 1.5px), radial-gradient(#BDE0FE 1.5px, #FAF6F0 1.5px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            font-family: 'Mitr', 'Fredoka', sans-serif;
            color: #4A4744;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            background: #FFFFFF;
            padding: 45px 35px;
            border-radius: 40px;
            /* อัปเกรดขอบให้เข้มและหนา มีเลเยอร์เหมือนการ์ตูน Y2K */
            border: 5px solid #4A4238; 
            box-shadow: 12px 12px 0px #4A4238;
        }

        /* โซนแบรนด์ด้านบนสุด */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        /* ตัวกรอบรูปโลโก้แบบหนานุ่มลอยตัว */
        .brand-logo-container {
            position: relative;
            display: inline-block;
        }
        .brand-logo {
            width: 100px;
            height: 100px;
            border-radius: 32px; /* เปลี่ยนเป็นสี่เหลี่ยมขอบมนแบบไอคอนแอป จะดูโมเดิร์นกว่าวงกลม */
            border: 4px solid #4A4238;
            box-shadow: 5px 5px 0px #4A4238;
            object-fit: cover;
            background-color: #FFF;
        }

        /* หัวข้อ Tummy.mkt สไตล์เยลลี่อักษรนูน (3D Bubble Text) */
        h1 {
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            color: #FF85A2;
            font-size: 52px; /* ปรับขนาดให้ใหญ่ตะโกน */
            font-weight: 700;
            margin: 5px 0 0 0;
            letter-spacing: -1px;
            /* เทคนิคเงา 3 ชั้นเพื่อความละมุนและอ่านง่าย */
            text-shadow: 
                -2px -2px 0 #FFF,  
                 2px -2px 0 #FFF,
                -2px  2px 0 #FFF,
                 2px  2px 0 #FFF,
                 4px  4px 0px #FFC2D1, 
                 8px  8px 0px #4A4238;
        }

        .subtitle {
            text-align: center;
            color: #608048;
            margin-bottom: 40px;
            font-size: 15px;
            font-weight: 500;
            background: #E8F5E9;
            display: table;
            margin-left: auto;
            margin-right: auto;
            padding: 8px 24px;
            border-radius: 25px;
            border: 3px solid #4A4238;
            box-shadow: 4px 4px 0px #4A4238;
        }

        .queue-list-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .queue-card-header {
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            color: #7A746B;
            font-size: 14px;
            font-weight: 700;
        }

        /* ปรับแต่งกล่องคิวให้ดูมีมิติมากขึ้นเด้งสู้มือ */
        .queue-card {
            background: #FFFDFB;
            border: 4px solid #4A4238;
            border-radius: 26px;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 6px 6px 0px #4A4238;
            transition: all 0.2s ease;
        }

        .queue-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 9px 9px 0px #4A4238;
            background: #FFFFFF;
        }

        .queue-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .queue-number {
            background: #FFE5D9;
            border: 3px solid #4A4238;
            color: #4A4238;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 3px 3px 0px #4A4238;
        }

        .customer-name {
            font-size: 20px;
            font-weight: 700;
            color: #4A4238;
        }

        .queue-time {
            font-size: 13px;
            color: #8A8276;
            margin-top: 4px;
            font-weight: 500;
        }

        /* ปุ่มสเตตัสพาสเทลขอบหนา */
        .status-badge {
            padding: 12px 24px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 700;
            border: 3px solid #4A4238;
            box-shadow: 4px 4px 0px #4A4238;
            text-align: center;
        }
        .status-working { background-color: #A2D2FF; color: #1D3557; }
        .status-brief { background-color: #E6CCB2; color: #5D4037; }
        .status-paid { background-color: #C1E1C1; color: #2D4A22; }
        .status-pending { background-color: #FFB7B2; color: #662E2E; }
        .status-done { background-color: #F3C4FB; color: #4A154B; }
    </style>
</head>
<body>

    <div class="container">
        <!-- โซนโลโก้และหัวข้อแบบป๊อป 3D -->
        <div class="brand-header">
            <div class="brand-logo-container">
                <!-- ⚠️ เปลี่ยนรูปโลโก้ของร้านเตงตรงนี้ได้เลยนะครับ -->
                <img class="brand-logo" src="https://api.dicebear.com/7.x/kaisei/svg?seed=Tummy" alt="Tummy.mkt Logo">
            </div>
            <h1>Tummy.mkt</h1>
        </div>
        
        <p class="subtitle">✨ ตรวจสอบสถานะคิวงานล่าสุด ✨</p>

        <div class="queue-card-header">
            <span>ข้อมูลลูกค้า</span>
            <span>สถานะปัจจุบัน</span>
        </div>

        <div class="queue-list-container" id="customer-queue-box">
            <!-- ข้อมูลคิวจะแสดงตรงนี้ -->
        </div>
    </div>

    <script>
        function getStatusConfig(status) {
            switch(status) {
                case 'working': return { class: 'status-working', text: 'กำลังทำ 🟦' };
                case 'brief': return { class: 'status-brief', text: 'รอบรีฟ 🟫' };
                case 'paid': return { class: 'status-paid', text: 'จ่ายเงินแล้ว 🟩' };
                case 'pending': return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
                case 'done': return { class: 'status-done', text: 'เสร็จแล้ว 🩷' };
                default: return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
            }
        }

        function renderCustomerCards() {
            const queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];
            const box = document.getElementById('customer-queue-box');
            box.innerHTML = '';

            if (queueData.length === 0) {
                box.innerHTML = `<div style="text-align:center; color:#8A8276; padding: 40px; background:#FFFDFB; border:3px dashed #4A4238; border-radius:26px; font-weight:500;">ยังไม่มีรายการคิวเลยน้า~ ไว้มาดูใหม่นะคะ 🐰</div>`;
                return;
            }

            queueData.forEach((item, index) => {
                const statusInfo = getStatusConfig(item.status);
                box.innerHTML += `
                    <div class="queue-card">
                        <div class="queue-info">
                            <div class="queue-number">${index + 1}</div>
                            <div>
                                <div class="customer-name">${item.name}</div>
                                <div class="queue-time">🕒 ${item.time}</div>
                            </div>
                        </div>
                        <div class="status-badge ${statusInfo.class}">${statusInfo.text}</div>
                    </div>
                `;
            });
        }
        renderCustomerCards();
        window.addEventListener('storage', (e) => { if(e.key === 'pastel_queues') renderCustomerCards(); });
    </script>
</body>
</html>
