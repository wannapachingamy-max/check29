<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 ตรวจสอบสถานะคิวพาสเทล 🌸</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap">
    <style>
        /* อนิเมชั่นเด้งนุ่มๆ */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 0.8; }
            70% { transform: scale(0.9); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideLeftIn {
            0% { transform: translateX(120%); opacity: 0; }
            70% { transform: translateX(-5%); opacity: 1; }
            100% { transform: translateX(0); opacity: 1; }
        }

        body {
            background-color: #F9F6F0;
            font-family: 'Mitr', sans-serif;
            color: #5D5A56;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 40px auto;
            background: #FFFFFF;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(165, 147, 124, 0.06);
            animation: bounceIn 0.6s ease-out;
        }
        h1 {
            text-align: center;
            color: #FFB7B2;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #B2C9AB;
            margin-bottom: 40px;
            font-size: 15px;
        }
        .queue-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }
        .queue-table th {
            padding: 12px 15px;
            text-align: left;
            color: #A39E98;
            font-weight: 400;
            font-size: 15px;
        }
        .queue-table td {
            padding: 18px 15px;
            background-color: #FAF8F5;
            vertical-align: middle;
            border-top: 1px solid rgba(255,255,255,0.7);
            transition: all 0.3s ease;
        }
        .queue-table tr:hover td {
            background-color: #F3EFE9;
            transform: translateY(-2px);
        }
        .queue-table tr td:first-child { border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
        .queue-table tr td:last-child { border-top-right-radius: 16px; border-bottom-right-radius: 16px; }
        
        /* ป้ายสถานะ 🟦🟫🟩🟥🩷 */
        .status-badge {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            display: inline-block;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .status-working { background-color: #B3CDE3; color: #FFFFFF; }
        .status-brief { background-color: #E5D3CD; color: #5D4037; }
        .status-paid { background-color: #CCEBC5; color: #33691E; }
        .status-pending { background-color: #FBB4AE; color: #FFFFFF; }
        .status-done { background-color: #DECBE4; color: #4A0E4E; }

        /* Popup แจ้งเตือนสุดน่ารัก */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 5px solid #FFC6FF;
            animation: slideLeftIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #6D6A66;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toast-box"></div>

    <div class="container">
        <h1>✨ ตรวจสอบสถานะคิว ✨</h1>
        <p class="subtitle">เช็คคิว วันที่ และเวลาอัปเดตล่าสุดที่นี่เลยน้า~</p>

        <table class="queue-table">
            <thead>
                <tr>
                    <th>ลำดับ</th>
                    <th>ชื่อลูกค้า</th>
                    <th>วันที่ / เวลา</th>
                    <th>สถานะปัจจุบัน</th>
                </tr>
            </thead>
            <tbody id="customer-queue-tbody"></tbody>
        </table>
    </div>

    <script>
        function showToast(message) {
            const container = document.getElementById('toast-box');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `🔔 <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function getStatusConfig(status) {
            switch(status) {
                case 'working': return { class: 'status-working', text: 'กำลังทำ 🟦' };
                case 'brief': return { class: 'status-brief', text: 'รอบรีฟ 🟫' };
                case 'paid': return { class: 'status-paid', text: 'จ่ายเงินแล้ว 🟩' };
                case 'pending': return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
                case 'done': return { class: 'status-done', text: 'เสร็จแล้ว 🩷' };
                default: return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
            }
        }

        function renderCustomerTable() {
            const queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];
            const tbody = document.getElementById('customer-queue-tbody');
            tbody.innerHTML = '';

            if (queueData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#B5B1AA; padding: 40px 0;">ตอนนี้ยังไม่มีรายการคิวเลยน้า~ 🐰</td></tr>`;
                return;
            }

            queueData.forEach((item, index) => {
                const statusInfo = getStatusConfig(item.status);
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.name}</strong></td>
                        <td><span style="font-size:13px; color:#A39E98;">${item.time}</span></td>
                        <td><span class="status-badge ${statusInfo.class}">${statusInfo.text}</span></td>
                    </tr>
                `;
            });
        }

        renderCustomerTable();
        
        window.addEventListener('storage', (e) => {
            if(e.key === 'pastel_queues') {
                renderCustomerTable();
                showToast('ข้อมูลคิวมีการอัปเดตจากแอดมินจ้า! ✨');
            }
        });
    </script>
</body>
</html>
