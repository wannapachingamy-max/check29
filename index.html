<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 ตรวจสอบสถานะคิวพาสเทล 🌸</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap">
    <style>
        body {
            background-color: #F7F4EF;
            font-family: 'Mitr', sans-serif;
            color: #5D5A56;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #FFFFFF;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(165, 147, 124, 0.08);
        }
        h1 {
            text-align: center;
            color: #FFB7B2;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #B2C9AB;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .queue-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }
        .queue-table th {
            padding: 12px;
            text-align: left;
            color: #8E8A85;
            font-weight: 400;
        }
        .queue-table td {
            padding: 15px;
            background-color: #FAF8F5;
            vertical-align: middle;
        }
        .queue-table tr td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        .queue-table tr td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        
        /* สถานะพาสเทล 🟦🟫🟩🟥🩷 */
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: inline-block;
            text-align: center;
        }
        .status-working { background-color: #AEC6CF; color: #FFFFFF; }
        .status-brief { background-color: #D7CCC8; color: #5D4037; }
        .status-paid { background-color: #C5E1A5; color: #33691E; }
        .status-pending { background-color: #FFB7B2; color: #FFFFFF; }
        .status-done { background-color: #FFC6FF; color: #4A0E4E; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ ตรวจสอบสถานะคิว ✨</h1>
        <p class="subtitle">เช็คคิว วันที่ และเวลาอัปเดตล่าสุดที่นี่เลยน้า~</p>

        <table class="queue-table">
            <thead>
                <tr>
                    <th>ลำดับ</th>
                    <th>ชื่อลูกค้า</th>
                    <th>วันที่ / เวลา</th>
                    <th>สถานะปัจจุบัน</th>
                </tr>
            </thead>
            <tbody id="customer-queue-tbody">
                </tbody>
        </table>
    </div>

    <script>
        // โหลดข้อมูลคิวร่วมกันจาก LocalStorage
        const queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];

        function getStatusConfig(status) {
            switch(status) {
                case 'working': return { class: 'status-working', text: 'กำลังทำ 🟦' };
                case 'brief': return { class: 'status-brief', text: 'รอบรีฟ 🟫' };
                case 'paid': return { class: 'status-paid', text: 'จ่ายเงินแล้ว 🟩' };
                case 'pending': return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
                case 'done': return { class: 'status-done', text: 'เสร็จแล้ว 🩷' };
                default: return { class: 'status-pending', text: 'ยังไม่ได้ทำ 🟥' };
            }
        }

        function renderCustomerTable() {
            const tbody = document.getElementById('customer-queue-tbody');
            tbody.innerHTML = '';

            if (queueData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">ตอนนี้ยังไม่มีรายการคิวเลยน้า~ 🐰</td></tr>`;
                return;
            }

            queueData.forEach((item, index) => {
                const statusInfo = getStatusConfig(item.status);
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.name}</strong></td>
                        <td><span style="font-size:13px; color:#888;">${item.time}</span></td>
                        <td><span class="status-badge ${statusInfo.class}">${statusInfo.text}</span></td>
                    </tr>
                `;
            });
        }

        // รันการแสดงผลทันทีเมื่อเปิดหน้า
        renderCustomerTable();
        
        // ฟังก์ชันพิเศษ: ตรวจจับหากหลังบ้านมีการแก้ไข ข้อมูลหน้าจอลูกค้าจะอัปเดตตามอัตโนมัติ (ไม่ต้องกดรีเฟรชซ้ำ)
        window.addEventListener('storage', () => {
            location.reload();
        });
    </script>
</body>
</html>
