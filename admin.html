<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy.mkt - Admin Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;600;700&display=swap">
    <style>
        body {
            background-color: #F8F9FA;
            font-family: 'Kanit', sans-serif;
            color: #4A4A4A;
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
        }

        h1 {
            font-family: 'Poppins', 'Kanit', sans-serif;
            color: #FF7E1F;
            font-size: 30px;
            font-weight: 700;
            margin: 0;
        }

        .admin-tag {
            background: #FF7E1F;
            color: #FFF;
            padding: 3px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 30px;
            display: table;
            margin-left: auto;
            margin-right: auto;
        }

        /* 📢 กล่องจัดการข้อความประกาศของแอดมิน */
        .announce-admin-box {
            background: #FFF2E8;
            border: 1px solid #FFE0CC;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .announce-admin-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #DFE3E6;
            border-radius: 10px;
            font-family: 'Kanit', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .announce-admin-box button {
            background-color: #2ECC71;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Kanit', sans-serif;
        }
        .announce-admin-box button:hover { background-color: #27AE60; }

        .queue-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 35px;
            background: #FAFAFA;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #ECEFF1;
        }

        .queue-form input {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #DFE3E6;
            font-family: 'Kanit', sans-serif;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
            outline: none;
        }

        .queue-form button {
            background-color: #FF7E1F;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            color: white;
            font-family: 'Kanit', sans-serif;
            font-size: 14px;
        }
        .queue-form button:hover { background-color: #E06613; }

        .admin-grid { display: flex; flex-direction: column; gap: 12px; }

        .admin-card {
            background: #FFFFFF;
            border: 1px solid #ECEFF1;
            border-radius: 14px;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 40px 1.5fr 1fr 1fr 1fr 70px;
            align-items: center;
            gap: 10px;
        }

        .admin-num {
            font-weight: 600;
            background: #FFF2E8;
            color: #FF7E1F;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 14px;
        }

        .contact-link {
            color: #FF7E1F;
            text-decoration: none;
            font-weight: 500;
            background: #FFF2E8;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            text-align: center;
            font-size: 13px;
        }

        .status-select {
            font-family: 'Kanit', sans-serif;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #DFE3E6;
            background-color: #FFF;
            cursor: pointer;
            outline: none;
            font-size: 13px;
        }

        .btn-delete {
            background-color: #FFEBEE;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #C62828;
            font-family: 'Kanit', sans-serif;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <img class="brand-logo" src="https://api.dicebear.com/7.x/kaisei/svg?seed=Tummy" alt="Tummy.mkt Logo">
            <h1>Tummy.mkt</h1>
        </div>
        <div class="admin-tag">ADMIN MANAGEMENT</div>
        
        <!-- 📢 โซนจัดการแถบประกาศข้อความ -->
        <div class="announce-admin-box">
            <span style="font-size: 20px;">📢</span>
            <input type="text" id="announce-input" placeholder="พิมพ์ข้อความประกาศข่าวสารของร้านตรงนี้...">
            <button onclick="updateAnnouncement()">อัปเดตประกาศ ✨</button>
        </div>

        <form class="queue-form" onsubmit="handleFormSubmit(event)">
            <input type="text" id="customer-name" placeholder="ชื่อลูกค้า" required>
            <input type="text" id="customer-contact" placeholder="ช่องทางติดต่อ (ลิงก์/ไลน์ไอดี)" required>
            <button type="submit">เพิ่มคิว</button>
        </form>

        <div class="admin-grid" id="admin-queue-box"></div>
    </div>

    <script>
        let queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];

        // โหลดประกาศมาแสดงในกล่อง Input ตอนเปิดหน้าแรก
        document.getElementById('announce-input').value = localStorage.getItem('tummy_announcement') || 'ยินดีต้อนรับสู่ Tummy.mkt! สามารถเช็คคิวงานปัจจุบันของตัวเองได้เลยน้า 🧡';

        // ฟังก์ชันบันทึกประกาศข่าวสาร
        function updateAnnouncement() {
            const txt = document.getElementById('announce-input').value;
            localStorage.setItem('tummy_announcement', txt);
            alert('อัปเดตประกาศข่าวสารเรียบร้อยแล้วค่ะ! 🎉');
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const nameInput = document.getElementById('customer-name');
            const contactInput = document.getElementById('customer-contact');

            const newQueue = {
                id: Date.now(),
                name: nameInput.value,
                contact: contactInput.value,
                time: new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }),
                status: 'pending'
            };

            queueData.push(newQueue);
            saveAndRefresh();
            nameInput.value = '';
            contactInput.value = '';
        }

        function updateStatus(id, newStatus) {
            queueData = queueData.map(item => { if (item.id === id) item.status = newStatus; return item; });
            saveAndRefresh();
        }

        function deleteQueue(id) {
            if(confirm('ต้องการลบคิวนี้ใช่ไหม?')) {
                queueData = queueData.filter(item => item.id !== id);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('pastel_queues', JSON.stringify(queueData));
            renderAdminTable();
        }

        function formatContactLink(contact) {
            if (contact.startsWith('http://') || contact.startsWith('https://')) {
                return `<a href="${contact}" target="_blank" class="contact-link">📱 ลิงก์ติดต่อ</a>`;
            } else {
                return `<a href="https://line.me/R/ti/p/~${contact}" target="_blank" class="contact-link">📱 Line: ${contact}</a>`;
            }
        }

        function renderAdminTable() {
            const box = document.getElementById('admin-queue-box');
            box.innerHTML = '';
            if (queueData.length === 0) { box.innerHTML = `<div style="text-align:center; padding: 20px; color:#A0A0A0; font-size:14px;">ไม่มีรายการคิว</div>`; return; }

            queueData.forEach((item, index) => {
                box.innerHTML += `
                    <div class="admin-card">
                        <div class="admin-num">${index + 1}</div>
                        <div><strong>${item.name}</strong></div>
                        <div>${formatContactLink(item.contact)}</div>
                        <div style="font-size:12px; color:#888;">🕒 ${item.time}</div>
                        <div>
                            <select class="status-select" onchange="updateStatus(${item.id}, this.value)">
                                <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>ยังไม่ได้ทำ 🟥</option>
                                <option value="paid" ${item.status === 'paid' ? 'selected' : ''}>จ่ายเงินแล้ว 🟩</option>
                                <option value="brief" ${item.status === 'brief' ? 'selected' : ''}>รอบรีฟ 🟫</option>
                                <option value="working" ${item.status === 'working' ? 'selected' : ''}>กำลังทำ 🟦</option>
                                <option value="done" ${item.status === 'done' ? 'selected' : ''}>เสร็จแล้ว 🩷</option>
                            </select>
                        </td>
                        <div><button onclick="deleteQueue(${item.id})" class="btn-delete">ลบ</button></div>
                    </div>
                `;
            });
        }
        renderAdminTable();
    </script>
</body>
</html>
