<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ ระบบหลังบ้านแอดมิน 🛠️</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;700&display=swap">
    <style>
        @keyframes popUp {
            0% { transform: scale(0.9) rotate(-1deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes toastIn {
            0% { transform: translateY(-50px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        body {
            background-color: #EDF6F9;
            background-image: radial-gradient(#FFCBF2 1px, transparent 1px), radial-gradient(#F3C68F 1px, #EDF6F9 1px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            font-family: 'Mitr', sans-serif;
            color: #4A4744;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 20px auto;
            background: #FFFFFF;
            padding: 35px;
            border-radius: 35px;
            border: 4px solid #4A4744;
            box-shadow: 10px 10px 0px #4A4744;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        h1 {
            color: #FF9AA2;
            font-size: 30px;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px #4A4744;
            -webkit-text-stroke: 1px #4A4744;
        }

        /* ฟอร์มกรอกข้อมูลแบบตะโกนความน่ารัก */
        .queue-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 40px;
            background: #FFF0F5;
            padding: 25px;
            border-radius: 25px;
            border: 3px solid #4A4744;
            box-shadow: 5px 5px 0px #4A4744;
        }

        .queue-form input {
            padding: 15px;
            border-radius: 18px;
            border: 3px solid #4A4744;
            font-family: 'Mitr', sans-serif;
            font-size: 15px;
            flex: 1;
            min-width: 220px;
            outline: none;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
        }

        .queue-form button {
            background-color: #FFDAC1;
            border: 3px solid #4A4744;
            padding: 15px 30px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            color: #4A4744;
            font-family: 'Mitr', sans-serif;
            box-shadow: 4px 4px 0px #4A4744;
            transition: all 0.1s ease;
        }

        .queue-form button:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #4A4744;
            background-color: #FFB7B2;
            color: white;
        }

        /* ปรับการ์ดการจัดการของแอดมิน */
        .admin-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-card {
            background: #FAF8F5;
            border: 3px solid #4A4744;
            border-radius: 22px;
            padding: 20px;
            display: grid;
            grid-template-columns: 50px 1.5fr 1fr 1.2fr 1fr 80px;
            align-items: center;
            box-shadow: 5px 5px 0px #4A4744;
            gap: 10px;
        }

        .admin-card:hover {
            background: #FFF;
        }

        .admin-num {
            font-weight: 700;
            background: #E8AEB7;
            color: white;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 2px solid #4A4744;
        }

        /* ลิงก์ช่องทางติดต่อเยลลี่ดึ๋ง */
        .contact-link {
            color: #2B5973;
            text-decoration: none;
            font-weight: 500;
            background: #B5E2FA;
            padding: 8px 14px;
            border-radius: 14px;
            border: 2px solid #4A4744;
            box-shadow: 3px 3px 0px #4A4744;
            display: inline-block;
            text-align: center;
            font-size: 13px;
        }
        .contact-link:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #4A4744; }

        /* ตัวเลือกสถานะแอดมินหนาๆ */
        .status-select {
            font-family: 'Mitr', sans-serif;
            padding: 10px;
            border-radius: 16px;
            border: 3px solid #4A4744;
            background-color: #FFF;
            cursor: pointer;
            font-weight: 500;
            outline: none;
            box-shadow: 3px 3px 0px #4A4744;
        }

        .btn-delete {
            background-color: #FFB7B2;
            border: 2px solid #4A4744;
            padding: 8px 14px;
            border-radius: 14px;
            cursor: pointer;
            color: #4A4744;
            font-family: 'Mitr', sans-serif;
            font-weight: 500;
            box-shadow: 2px 2px 0px #4A4744;
        }
        .btn-delete:hover { background-color: #FF9AA2; transform: translate(1px, 1px); box-shadow: 1px 1px 0px #4A4744; }

        /* Toast ข้อความ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            background: #FFFFFF;
            padding: 15px 25px;
            border-radius: 20px;
            border: 3px solid #4A4744;
            box-shadow: 5px 5px 0px #4A4744;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toast-box"></div>

    <div class="container">
        <h1>🛠️ หลังบ้านแอดมิน Y2K Style</h1>
        
        <form class="queue-form" onsubmit="handleFormSubmit(event)">
            <input type="text" id="customer-name" placeholder="🧁 ใส่ชื่อลูกค้าพาสเทล" required>
            <input type="text" id="customer-contact" placeholder="🔗 ช่องทางติดต่อ (ใส่ลิ้งก์/ไลน์ไอดี)" required>
            <button type="submit">เพิ่มคิวดึ๋งๆ ✨</button>
        </form>

        <div class="admin-grid" id="admin-queue-box">
            <!-- ข้อมูลจะอัปเดตตรงนี้ -->
        </div>
    </div>

    <script>
        let queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];

        function triggerToast(message) {
            const container = document.getElementById('toast-box');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `🌟 <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const nameInput = document.getElementById('customer-name');
            const contactInput = document.getElementById('customer-contact');

            const newQueue = {
                id: Date.now(),
                name: nameInput.value,
                contact: contactInput.value,
                time: new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }),
                status: 'pending'
            };

            queueData.push(newQueue);
            saveAndRender();
            triggerToast(`เพิ่มคิวคุณ ${newQueue.name} เรียบร้อยป๊อปๆ!`);
            
            nameInput.value = '';
            contactInput.value = '';
        }

        function updateStatus(id, newStatus) {
            queueData = queueData.map(item => {
                if (item.id === id) item.status = newStatus;
                return item;
            });
            saveAndRender();
            triggerToast(`เปลี่ยนสถานะสำเร็จแล้วจ้า!`);
        }

        function deleteQueue(id) {
            if(confirm('จะลบคิวนี้จริงๆ หรอตะเอง? 🥺')) {
                queueData = queueData.filter(item => item.id !== id);
                saveAndRender();
                triggerToast('ลบคิวออกแล้วน้า!');
            }
        }

        function saveAndRender() {
            localStorage.setItem('pastel_queues', JSON.stringify(queueData));
            renderAdminTable();
        }

        function formatContactLink(contact) {
            if (contact.startsWith('http://') || contact.startsWith('https://')) {
                return `<a href="${contact}" target="_blank" class="contact-link">📱 ลิงก์ติดต่อ</a>`;
            } else {
                return `<a href="https://line.me/R/ti/p/~${contact}" target="_blank" class="contact-link">📱 Line: ${contact}</a>`;
            }
        }

        function renderAdminTable() {
            const box = document.getElementById('admin-queue-box');
            box.innerHTML = '';

            if (queueData.length === 0) {
                box.innerHTML = `<div style="text-align:center; color:#A39E98; padding: 30px 0;">ยังไม่มีรายการคิวให้จัดการเลยค่ะแอดมิน นั่งพักก่อนน้า ☕</div>`;
                return;
            }

            queueData.forEach((item, index) => {
                box.innerHTML += `
                    <div class="admin-card">
                        <div class="admin-num">${index + 1}</div>
                        <div><strong>${item.name}</strong></div>
                        <div>${formatContactLink(item.contact)}</div>
                        <div style="font-size:12px; color:#888;">🕒 ${item.time}</div>
                        <div>
                            <select class="status-select" onchange="updateStatus(${item.id}, this.value)">
                                <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>ยังไม่ได้ทำ 🟥</option>
                                <option value="paid" ${item.status === 'paid' ? 'selected' : ''}>จ่ายเงินแล้ว 🟩</option>
                                <option value="brief" ${item.status === 'brief' ? 'selected' : ''}>รอบรีฟ 🟫</option>
                                <option value="working" ${item.status === 'working' ? 'selected' : ''}>กำลังทำ 🟦</option>
                                <option value="done" ${item.status === 'done' ? 'selected' : ''}>เสร็จแล้ว 🩷</option>
                            </select>
                        </td>
                        <div><button onclick="deleteQueue(${item.id})" class="btn-delete">❌ ลบ</button></div>
                    </div>
                `;
            });
        }

        renderAdminTable();
    </script>
</body>
</html>
