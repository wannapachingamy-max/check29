<!DOCTYPE html>
<html lang="th">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy.mkt - Admin Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;600;700&display=swap">
    <style>
        body { background-color: #F8F9FA; font-family: 'Kanit', sans-serif; color: #4A4A4A; margin: 0; padding: 20px 12px; }
        .container { max-width: 950px; margin: 0 auto; background: #FFFFFF; padding: 25px 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); }
        
        @media (min-width: 768px) {
            body { padding: 30px 20px; }
            .container { padding: 35px; }
        }

        .brand-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; gap: 10px; }
        .brand-logo { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; }
        h1 { font-family: 'Poppins', 'Kanit', sans-serif; color: #FF7E1F; font-size: 30px; font-weight: 700; margin: 0; }
        .admin-tag { background: #FF7E1F; color: #FFF; padding: 3px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-bottom: 30px; display: table; margin-left: auto; margin-right: auto; }

        /* 📢 แผงควบคุมจัดการเพิ่มข่าวสาร */
        .announce-admin-panel {
            background: #FFF2E8; border: 1px solid #FFE0CC; padding: 15px; border-radius: 16px; margin-bottom: 25px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .announce-row { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        
        @media (min-width: 768px) {
            .announce-admin-panel { padding: 20px; }
            .announce-row { flex-direction: row; align-items: center; }
        }

        .announce-admin-panel input[type="text"], .announce-admin-panel select {
            width: 100%; box-sizing: border-radius; padding: 12px 16px; border: 1px solid #DFE3E6; border-radius: 10px;
            font-family: 'Kanit', sans-serif; font-size: 14px; outline: none; background: white; box-sizing: border-box;
        }
        
        @media (min-width: 768px) {
            .announce-admin-panel input[type="text"] { flex: 2; width: auto; }
            .announce-admin-panel select { flex: 1; width: auto; }
        }
        
        .file-upload-wrapper {
            display: flex; flex-direction: column; gap: 6px; background: white; 
            border: 1px solid #DFE3E6; padding: 10px 12px; border-radius: 10px; flex: 1; width: 100%; box-sizing: border-box;
        }
        .file-upload-wrapper label { font-size: 13px; color: #666; font-weight: 500; }
        .file-upload-wrapper input[type="file"] { width: 100%; }

        @media (min-width: 768px) {
            .file-upload-wrapper { flex-direction: row; align-items: center; gap: 10px; padding: 8px 12px; }
        }

        .img-preview { max-height: 45px; border-radius: 6px; display: none; object-fit: cover; margin: 5px 0; }
        
        .btn-add-announce { background-color: #2ECC71; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 500; font-family: 'Kanit', sans-serif; white-space: nowrap; width: 100%; }
        @media (min-width: 768px) { .btn-add-announce { width: auto; } }

        /* รายการประกาศปัจจุบัน */
        .active-announcements-list { margin-bottom: 30px; display: flex; flex-direction: column; gap: 10px; }
        .active-announce-item {
            background: #FAFAFA; border: 1px solid #ECEFF1; padding: 12px 15px; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
        }
        @media (min-width: 768px) {
            .active-announce-item { flex-direction: row; align-items: center; padding: 12px 20px; gap: 15px; }
        }
        .active-announce-item .text-part { font-size: 14px; color: #444; flex: 1; word-break: break-all; }
        .active-announce-item img { height: 40px; width: 60px; object-fit: cover; border-radius: 4px; }
        .btn-delete-announce { background-color: #FFEBEE; color: #C62828; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; width: 100%; }
        @media (min-width: 768px) { .btn-delete-announce { width: auto; padding: 6px 12px; } }

        /* ฟอร์มเพิ่มคิว */
        .queue-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 35px; background: #FAFAFA; padding: 15px; border-radius: 16px; border: 1px solid #ECEFF1; }
        .queue-form input { padding: 12px 16px; border-radius: 10px; border: 1px solid #DFE3E6; font-family: 'Kanit', sans-serif; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; }
        .queue-form button { background-color: #FF7E1F; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 500; color: white; font-family: 'Kanit', sans-serif; font-size: 14px; width: 100%; }
        
        @media (min-width: 768px) {
            .queue-form { flex-direction: row; padding: 20px; }
            .queue-form input { flex: 1; width: auto; }
            .queue-form button { width: auto; }
        }

        /* 📱 แก้ไขจุดนี้: Grid จัดการคิวงานแก้ปัญหามือถือล้น */
        .admin-grid { display: flex; flex-direction: column; gap: 12px; }
        .admin-card { 
            background: #FFFFFF; border: 1px solid #ECEFF1; border-radius: 14px; padding: 15px; 
            display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
        }
        
        /* เมื่อเปิดบนคอมพิวเตอร์ (หน้าจอ 768px ขึ้นไป) คืนรูปกลับไปเป็นตารางแถวตรงยาวกว้างๆ */
        @media (min-width: 768px) {
            .admin-card {
                display: grid; grid-template-columns: 40px 1.5fr 1fr 1fr 1fr 70px; align-items: center;
            }
        }

        .admin-num { font-weight: 600; background: #FFF2E8; color: #FF7E1F; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; }
        .customer-name-admin { font-size: 15px; font-weight: 600; color: #222; word-break: break-all; }
        .contact-link { color: #FF7E1F; text-decoration: none; font-weight: 500; background: #FFF2E8; padding: 8px 12px; border-radius: 8px; display: inline-block; text-align: center; font-size: 13px; width: 100%; box-sizing: border-box; }
        @media (min-width: 768px) { .contact-link { width: auto; padding: 6px 12px; } }
        
        .status-select { font-family: 'Kanit', sans-serif; padding: 10px; border-radius: 8px; border: 1px solid #DFE3E6; background-color: #FFF; cursor: pointer; outline: none; font-size: 13px; width: 100%; box-sizing: border-box; }
        @media (min-width: 768px) { .status-select { padding: 8px; width: auto; } }
        
        .btn-delete { background-color: #FFEBEE; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #C62828; font-family: 'Kanit', sans-serif; font-size: 13px; width: 100%; }
        @media (min-width: 768px) { .btn-delete { width: auto; padding: 6px 12px; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <img class="brand-logo" src="gkibotlrgpwer.jfif" alt="Logo">
            <h1>Tummy.mkt</h1>
        </div>
        <div class="admin-tag">ADMIN MANAGEMENT</div>
        
        <!-- 📢 แผงควบคุมจัดการเพิ่มข่าวสาร -->
        <div class="announce-admin-panel">
            <div style="font-size: 14px; font-weight: 600; color: #FF7E1F;">✨ สร้างประกาศข่าวสารใหม่ (Layout คู่ขนาน)</div>
            <div class="announce-row">
                <input type="text" id="announce-text-input" placeholder="พิมพ์เนื้อหาข่าวสาร..." required>
                <select id="announce-type-input">
                    <option value="general">📌 หมวดหมู่: ทั่วไป</option>
                    <option value="promo">🔥 หมวดหมู่: โปรโมชัน</option>
                    <option value="maintenance">🛠️ หมวดหมู่: ปิดปรับปรุง</option>
                </select>
            </div>
            <div class="announce-row">
                <div class="file-upload-wrapper">
                    <label>🖼️ รูปแบนเนอร์ด้านล่างการ์ด (ไม่เกิน 2MB): </label>
                    <input type="file" id="announce-file-input" accept="image/*" onchange="previewAnnounceImg(this)">
                </div>
                <img id="panel-preview" class="img-preview" src="" alt="Preview">
                <button class="btn-add-announce" onclick="addAnnouncement()">บันทึกและโพสต์ประกาศ 🚀</button>
            </div>
        </div>

        <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color:#666;">📢 รายการประกาศปัจจุบันบนหน้าเว็บ:</div>
        <div class="active-announcements-list" id="active-announcements-box"></div>

        <!-- ฟอร์มเพิ่มคิว -->
        <form class="queue-form" onsubmit="handleFormSubmit(event)">
            <input type="text" id="customer-name" placeholder="ชื่อลูกค้า" required>
            <input type="text" id="customer-contact" placeholder="ช่องทางติดต่อ (ลิงก์/ไลน์ไอดี)" required>
            <button type="submit">เพิ่มคิว</button>
        </form>

        <!-- รายการคิวหลังบ้าน -->
        <div class="admin-grid" id="admin-queue-box"></div>
    </div>

    <script>
        let queueData = JSON.parse(localStorage.getItem('pastel_queues')) || [];
        let announceData = JSON.parse(localStorage.getItem('tummy_announcements')) || [];
        let tempImgBase64 = "";

        function previewAnnounceImg(input) {
            const file = input.files[0];
            if (file) {
                if (file.size > 2097152) {
                    alert("⚠️ ขนาดไฟล์รูปใหญ่เกิน 2MB!");
                    input.value = "";
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempImgBase64 = e.target.result;
                    const preview = document.getElementById('panel-preview');
                    preview.src = tempImgBase64;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function addAnnouncement() {
            const textInput = document.getElementById('announce-text-input');
            const typeInput = document.getElementById('announce-type-input');
            if (!textInput.value.trim()) { alert("กรุณากรอกข้อความประกาศด้วยจ้า"); return; }

            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            const todayStr = new Date().toLocaleDateString('th-TH', options);

            const newAnnounce = {
                id: Date.now(),
                text: textInput.value,
                type: typeInput.value,
                img: tempImgBase64,
                date: todayStr
            };

            announceData.push(newAnnounce);
            localStorage.setItem('tummy_announcements', JSON.stringify(announceData));
            
            textInput.value = '';
            tempImgBase64 = '';
            document.getElementById('announce-file-input').value = '';
            document.getElementById('panel-preview').style.display = 'none';
            
            renderAnnounceManager();
            alert("โพสต์ประกาศข่าวสารเรียบร้อย! 🎉");
        }

        function deleteAnnouncement(id) {
            if(confirm('ต้องการลบประกาศนี้ใช่ไหม?')) {
                announceData = announceData.filter(item => item.id !== id);
                localStorage.setItem('tummy_announcements', JSON.stringify(announceData));
                renderAnnounceManager();
            }
        }

        function renderAnnounceManager() {
            const box = document.getElementById('active-announcements-box');
            box.innerHTML = '';
            if(announceData.length === 0) {
                box.innerHTML = `<div style="font-size:13px; color:#A0A0A0; padding:10px; background:#FAFAFA; border-radius:8px; text-align:center;">ยังไม่มีประกาศข่าวสาร</div>`;
                return;
            }
            announceData.forEach(item => {
                let imgTag = item.img ? `<img src="${item.img}">` : '<span style="color:#aaa; font-size:12px;">(ไม่มีรูป)</span>';
                box.innerHTML += `
                    <div class="active-announce-item">
                        <div class="text-part"><strong>[${item.type}]</strong> 💬 ${item.text} <span style="font-size:11px; color:#999;">(${item.date})</span></div>
                        <div style="display:flex; align-items:center; gap:10px; width:100%; justify-content:space-between; margin-top:5px;">
                            ${imgTag}
                            <button class="btn-delete-announce" onclick="deleteAnnouncement(${item.id})">ลบ 🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const nameInput = document.getElementById('customer-name');
            const contactInput = document.getElementById('customer-contact');

            const newQueue = {
                id: Date.now(),
                name: nameInput.value,
                contact: contactInput.value,
                time: new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }),
                status: 'pending'
            };

            queueData.push(newQueue);
            saveAndRefresh();
            nameInput.value = '';
            contactInput.value = '';
        }

        function updateStatus(id, newStatus) {
            queueData = queueData.map(item => { if (item.id === id) item.status = newStatus; return item; });
            saveAndRefresh();
        }

        function deleteQueue(id) {
            if(confirm('ต้องการลบคิวนี้ใช่ไหม?')) {
                queueData = queueData.filter(item => item.id !== id);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('pastel_queues', JSON.stringify(queueData));
            renderAdminTable();
        }

        function formatContactLink(contact) {
            if (contact.startsWith('http://') || contact.startsWith('https://')) {
                return `<a href="${contact}" target="_blank" class="contact-link">📱 ลิงก์ติดต่อ</a>`;
            } else {
                return `<a href="https://line.me/R/ti/p/~${contact}" target="_blank" class="contact-link">📱 Line: ${contact}</a>`;
            }
        }

        function renderAdminTable() {
            const box = document.getElementById('admin-queue-box');
            box.innerHTML = '';
            if (queueData.length === 0) { box.innerHTML = `<div style="text-align:center; padding: 20px; color:#A0A0A0; font-size:14px;">ไม่มีรายการคิว</div>`; return; }

            queueData.forEach((item, index) => {
                box.innerHTML += `
                    <div class="admin-card">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div class="admin-num">${index + 1}</div>
                            <div class="customer-name-admin">${item.name}</div>
                        </div>
                        <div>${formatContactLink(item.contact)}</div>
                        <div style="font-size:12px; color:#888;">🕒 ${item.time}</div>
                        <div>
                            <select class="status-select" onchange="updateStatus(${item.id}, this.value)">
                                <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>ยังไม่ได้ทำ 🟥</option>
                                <option value="paid" ${item.status === 'paid' ? 'selected' : ''}>จ่ายเงินแล้ว 🟩</option>
                                <option value="brief" ${item.status === 'brief' ? 'selected' : ''}>รอบรีฟ 🟫</option>
                                <option value="working" ${item.status === 'working' ? 'selected' : ''}>กำลังทำ 🟦</option>
                                <option value="done" ${item.status === 'done' ? 'selected' : ''}>เสร็จแล้ว 🩷</option>
                            </select>
                        </div>
                        <div><button onclick="deleteQueue(${item.id})" class="btn-delete">ลบ</button></div>
                    </div>
                `;
            });
        }
        renderAnnounceManager();
        renderAdminTable();
    </script>
</body>
</html>
