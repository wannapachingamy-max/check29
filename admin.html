<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy.mkt - Admin Management</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;600;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #F8FAFC; font-family: 'Kanit', sans-serif; color: #334155; margin: 0; padding: 30px 15px; }
        .container { max-width: 950px; margin: 0 auto; }
        h1 { color: #1E293B; font-size: 26px; font-weight: 600; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .grid-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 768px) { .grid-panel { grid-template-columns: 1fr; } }
        .panel-box { background: white; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .panel-title { font-size: 16px; font-weight: 600; color: #0F172A; margin: 0 0 15px 0; border-left: 4px solid #FF7E1F; padding-left: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #64748B; margin-bottom: 4px; font-weight: 500; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px; font-family: 'Kanit'; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #FF7E1F; box-shadow: 0 0 0 3px rgba(255,126,31,0.1); }
        .btn-submit { background: #FF7E1F; color: white; border: none; padding: 11px; width: 100%; border-radius: 8px; font-family: 'Kanit'; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
        .btn-submit:hover { background: #E26D14; }
        .active-announcements-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .active-announce-item { background: #F1F5F9; border-radius: 8px; padding: 10px; font-size: 13px; display: flex; flex-direction: column; }
        .active-announce-item img { max-width: 60px; max-height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
        .btn-delete-announce { background: #EF4444; color: white; border: none; padding: 2px 8px; border-radius: 4px; font-family: 'Kanit'; font-size: 11px; cursor: pointer; }
        .queue-table-section { background: white; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .admin-card-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .admin-card { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 20px; display: grid; grid-template-columns: 2fr 1fr 1.5fr 1.5fr 1fr; align-items: center; gap: 15px; }
        @media (max-width: 768px) { .admin-card { grid-template-columns: 1fr; gap: 8px; text-align: center; justify-items: center; } }
        .admin-num { background: #E2E8F0; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
        .customer-name-admin { font-weight: 500; font-size: 15px; color: #1E293B; }
        .contact-link { color: #2563EB; text-decoration: none; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
        .status-select { padding: 6px; font-size: 13px; border-radius: 6px; }
        .btn-delete { background: #EF4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-family: 'Kanit'; font-size: 12px; cursor: pointer; width: 100%; max-width: 70px; }
        .btn-delete:hover { background: #DC2626; }
        .img-preview-box { display: none; width: 100%; max-height: 100px; object-fit: contain; margin-top: 8px; border-radius: 6px; background: #fafafa; border: 1px dashed #ccc; }
        .social-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .social-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ Tummy.mkt - ระบบจัดการหลังบ้านแอดมิน</h1>

        <div class="grid-panel">
            <div class="panel-box">
                <p class="panel-title">👥 เพิ่มรายการคิวลูกค้าใหม่</p>
                <form id="add-queue-form" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label>ชื่อลูกค้า / นามแฝง</label>
                        <input type="text" id="customer-name" placeholder="เช่น คุณ สมชาย มั่งมี" required>
                    </div>
                    <div class="form-group">
                        <label>ID Line หรือ ลิงก์ช่องทางติดต่อ</label>
                        <input type="text" id="customer-contact" placeholder="somchai_line หรือ ใส่ลิงก์เต็ม" required>
                    </div>
                    <button type="submit" class="btn-submit">➕ ลงทะเบียนเข้าคิว</button>
                </form>
            </div>

            <div class="panel-box">
                <p class="panel-title">📢 สร้างโพสต์ประกาศข่าวสาร</p>
                <div class="form-group">
                    <label>หมวดหมู่ประกาศ</label>
                    <select id="announce-type-input">
                        <option value="general">📌 ข่าวสารทั่วไป</option>
                        <option value="promo">🔥 โปรโมชันพิเศษ</option>
                        <option value="maintenance">🛠️ แจ้งปิดปรับปรุงระบบ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ข้อความประกาศ</label>
                    <textarea id="announce-text-input" rows="2" placeholder="พิมพ์ข้อความที่ต้องการประกาศที่นี่..."></textarea>
                </div>
                <div class="form-group">
                    <label>รูปภาพประกอบ (ไม่เกิน 2MB)</label>
                    <input type="file" id="announce-file-input" accept="image/*" onchange="previewAnnounceImg(this)">
                    <img id="panel-preview" class="img-preview-box">
                </div>
                <button type="button" onclick="addAnnouncement()" class="btn-submit" style="background:#0F172A;">🚀 โพสต์ประกาศทันที</button>
                
                <div class="active-announcements-list" id="active-announcements-box"></div>
            </div>
        </div>

        <div class="panel-box" style="margin-bottom: 30px;">
            <p class="panel-title">🔗 ตั้งค่าลิงก์ปุ่มติดต่อของร้าน</p>
            <div class="social-row">
                <div class="form-group"><label>Facebook Link</label><input type="text" id="link-fb-input" placeholder="https://facebook.com/..."></div>
                <div class="form-group"><label>Line ID / Link</label><input type="text" id="link-line-input" placeholder="ใส่ ID line หรือ ลิงก์เพิ่มเพื่อน"></div>
                <div class="form-group"><label>Instagram Link</label><input type="text" id="link-ig-input" placeholder="https://instagram.com/..."></div>
            </div>
            <button type="button" onclick="saveSocialLinks()" class="btn-submit" style="background:#10B981; max-width:200px;">💾 บันทึกลิงก์โซเชียล</button>
        </div>

        <div class="queue-table-section">
            <p class="panel-title" style="margin-bottom:0;">📋 รายการคิวงานที่กำลังรันระบบ</p>
            <div class="admin-card-list" id="admin-queue-box"></div>
        </div>
    </div>

    <!-- 📍 ตัวเชื่อมต่อระบบ Real-time แบบ Firebase SDK หลัก -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://tummy-queue-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let tempImgBase64 = "";
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, timerProgressBar: true });

        database.ref('social_links').on('value', snapshot => {
            const links = snapshot.val();
            if(links){
                document.getElementById('link-fb-input').value = links.fb === '#' ? '' : links.fb;
                document.getElementById('link-line-input').value = links.line === '#' ? '' : links.line;
                document.getElementById('link-ig-input').value = links.ig === '#' ? '' : links.ig;
            }
        });

        database.ref('announcements').on('value', snapshot => {
            const data = snapshot.val();
            const box = document.getElementById('active-announcements-box'); box.innerHTML = '';
            if(!data) return;
            Object.keys(data).forEach(key => {
                let item = data[key];
                let imgTag = item.img ? `<img src="${item.img}">` : '<span style="color:#aaa; font-size:12px;">(ไม่มีรูป)</span>';
                box.innerHTML += `<div class="active-announce-item"><div class="text-part"><strong>[${item.type}]</strong> 💬 ${item.text}</div><div style="display:flex; align-items:center; gap:10px; width:100%; justify-content:space-between; margin-top:5px;">${imgTag} <button class="btn-delete-announce" onclick="deleteAnnouncement('${key}')">ลบ 🗑️</button></div></div>`;
            });
        });

        database.ref('queues').on('value', snapshot => {
            const data = snapshot.val();
            const box = document.getElementById('admin-queue-box'); box.innerHTML = '';
            if (!data) return;
            Object.keys(data).forEach((key, index) => {
                let item = data[key];
                let cLink = item.contact.startsWith('http') ? item.contact : `https://line.me/R/ti/p/~${item.contact}`;
                box.innerHTML += `<div class="admin-card"><div style="display:flex; align-items:center; gap:10px;"><div class="admin-num">${index + 1}</div><div class="customer-name-admin">${item.name}</div></div><div><a href="${cLink}" target="_blank" class="contact-link">📱 ติดต่อ</a></div><div style="font-size:12px; color:#888;">🕒 ${item.time}</div><div><select class="status-select" onchange="updateStatus('${key}', this.value)"><option value="pending" ${item.status === 'pending' ? 'selected' : ''}>ยังไม่ได้ทำ 🟥</option><option value="paid" ${item.status === 'paid' ? 'selected' : ''}>จ่ายเงินแล้ว 🟩</option><option value="brief" ${item.status === 'brief' ? 'selected' : ''}>รอบรีฟ 🟫</option><option value="working" ${item.status === 'working' ? 'selected' : ''}>กำลังทำ 🟦</option><option value="done" ${item.status === 'done' ? 'selected' : ''}>เสร็จแล้ว 🩷</option></select></div><div><button onclick="deleteQueue('${key}', '${item.name}')" class="btn-delete">ลบ</button></div></div>`;
            });
        });

        function saveSocialLinks() {
            let lineVal = document.getElementById('link-line-input').value.trim();
            if(lineVal && !lineVal.startsWith('http')) lineVal = `https://line.me/R/ti/p/~${lineVal}`;
            const links = { fb: document.getElementById('link-fb-input').value.trim() || '#', line: lineVal || '#', ig: document.getElementById('link-ig-input').value.trim() || '#' };
            database.ref('social_links').set(links, () => Toast.fire({ icon: 'success', title: 'บันทึกลิงก์เรียบร้อยแล้วจ้า! 🎉' }));
        }

        function previewAnnounceImg(input) {
            const file = input.files[0];
            if (file) {
                if (file.size > 2097152) { Swal.fire({ icon: 'error', title: 'ขนาดไฟล์เกินกำหนด!', text: 'กรุณาเลือกรูปภาพขนาดไม่เกิน 2MB นะครับ' }); input.value = ""; return; }
                const reader = new FileReader();
                reader.onload = function(e) { tempImgBase64 = e.target.result; const preview = document.getElementById('panel-preview'); preview.src = tempImgBase64; preview.style.display = 'block'; }
                reader.readAsDataURL(file);
            }
        }

        function addAnnouncement() {
            const textInput = document.getElementById('announce-text-input');
            const typeInput = document.getElementById('announce-type-input');
            if (!textInput.value.trim()) { Swal.fire({ icon: 'warning', title: 'อุ๊ย! ลืมพิมพ์ข้อความ', text: 'กรุณากรอกข้อความประกาศด้วยจ้า' }); return; }
            const todayStr = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
            const newAnnounce = { text: textInput.value, type: typeInput.value, img: tempImgBase64, date: todayStr };

            database.ref('announcements').push(newAnnounce, () => {
                textInput.value = ''; tempImgBase64 = ''; document.getElementById('announce-file-input').value = ''; document.getElementById('panel-preview').style.display = 'none';
                Toast.fire({ icon: 'success', title: 'โพสต์ประกาศออนไลน์แล้ว! 🚀' });
            });
        }

        function deleteAnnouncement(key) {
            Swal.fire({ title: 'ยืนยันการลบประกาศ?', text: "ประกาศนี้จะหายไปจากหน้าหลักของลูกค้าทันที", icon: 'warning', showCancelButton: true, confirmButtonColor: '#E53935', cancelButtonColor: '#90A4AE', confirmButtonText: 'ใช่, ลบเลย!', cancelButtonText: 'ยกเลิก' }).then((result) => {
                if (result.isConfirmed) {
                    database.ref(`announcements/${key}`).remove(() => Toast.fire({ icon: 'success', title: 'ลบประกาศเรียบร้อย' }));
                }
            });
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const nameInput = document.getElementById('customer-name');
            const contactInput = document.getElementById('customer-contact');
            const newQueue = { name: nameInput.value, contact: contactInput.value, time: new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }), status: 'pending' };

            database.ref('queues').push(newQueue, () => {
                Toast.fire({ icon: 'success', title: `เพิ่มคิวคุณ ${nameInput.value} สำเร็จ` });
                nameInput.value = ''; contactInput.value = '';
            });
        }

        function updateStatus(key, newStatus) {
            database.ref(`queues/${key}/status`).set(newStatus, () => Toast.fire({ icon: 'info', title: 'อัปเดตสถานะคิวแล้ว 🕒' }));
        }

        function deleteQueue(key, name) {
            Swal.fire({ title: 'ต้องการลบคิวนี้ใช่ไหม?', text: `คุณกำลังจะลบคิวของ คุณ ${name}`, icon: 'question', showCancelButton: true, confirmButtonColor: '#D32F2F', cancelButtonColor: '#B0BEC5', confirmButtonText: 'ใช่, ลบออก', cancelButtonText: 'เก็บคิวไว้ก่อน' }).then((result) => {
                if (result.isConfirmed) {
                    database.ref(`queues/${key}`).remove(() => Toast.fire({ icon: 'success', title: 'ลบคิวเรียบร้อยแล้ว' }));
                }
            });
        }
    </script>
</body>
</html>
