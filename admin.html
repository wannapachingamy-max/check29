<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy.mkt - Admin Panel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-minimal@5/minimal.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f8fafc; color: #334155; padding: 30px 20px; margin: 0; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { color: #ff7e1f; font-size: 24px; margin-bottom: 25px; border-bottom: 2px solid #ff7e1f; padding-bottom: 10px; }
        h2 { font-size: 18px; color: #475569; margin-top: 30px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; font-weight: 500; }
        input, select, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: 'Kanit'; font-size: 14px; }
        button { background: #ff7e1f; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-family: 'Kanit'; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #e06613; }
        
        /* สไตล์รายการประกาศสำหรับแอดมิน */
        .announcement-list-item { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .announcement-info { flex: 1; }
        .announcement-text { font-size: 14px; margin: 0 0 5px 0; font-weight: 500; }
        .announcement-meta { font-size: 12px; color: #64748b; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background: #dc2626; }
        
        .queue-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .queue-actions { display: flex; gap: 8px; }
        .select-status { padding: 5px; border-radius: 8px; font-family: 'Kanit'; font-size: 13px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>🛠️ แผงควบคุมแอดมิน - Tummy.mkt</h1>

        <h2>📢 เพิ่มประกาศข่าวสารใหม่</h2>
        <div class="form-group">
            <label>ข้อความประกาศ</label>
            <textarea id="news-text" rows="3" placeholder="พิมพ์ข้อความที่ต้องการประกาศ..."></textarea>
        </div>
        <div class="form-group">
            <label>ประเภทประกาศ</label>
            <select id="news-type">
                <option value="general">📌 ทั่วไป</option>
                <option value="promo">🔥 โปรโมชัน</option>
                <option value="maintenance">🛠️ ปิดปรับปรุง</option>
            </select>
        </div>
        <div class="form-group">
            <label>ลิงก์รูปภาพประกอบ (ใส่หรือไม่ใส่ก็ได้)</label>
            <input type="text" id="news-img" placeholder="https://example.com/image.jpg">
        </div>
        <button onclick="addAnnouncement()">🚀 โพสต์ประกาศข่าวสาร</button>

        <h2>📋 รายการประกาศปัจจุบัน (สามารถลบได้)</h2>
        <div id="admin-annancements-list">กำลังโหลดข้อมูล...</div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px dashed #cbd5e1;">

        <h2>👥 เพิ่มคิวลูกค้าใหม่</h2>
        <div class="form-group">
            <label>ชื่อลูกค้า</label>
            <input type="text" id="cust-name" placeholder="คุณ สมชาย">
        </div>
        <button onclick="addQueue()">➕ เพิ่มเข้าสู่ระบบคิว</button>

        <h2>📋 รายการคิวลูกค้าปัจจุบัน</h2>
        <div id="admin-queue-list">กำลังโหลดข้อมูล...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // เชื่อมต่อฐานข้อมูลเดิม 100%
        const firebaseConfig = { databaseURL: "https://tummy-queue-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ฟังก์ชันสำหรับเพิ่มประกาศข่าวสาร
        function addAnnouncement() {
            const text = document.getElementById('news-text').value.trim();
            const type = document.getElementById('news-type').value;
            const img = document.getElementById('news-img').value.trim();
            
            if(!text) {
                Swal.fire('กรุณากรอกข้อความ', '', 'warning');
                return;
            }

            const now = new Date();
            const dateString = `${now.getDate()} ม.ค. ${now.getFullYear() + 543}`; // แปลงเป็น พ.ศ. ง่าย ๆ

            // ส่งข้อมูลไปเซฟที่ Firebase
            database.ref('announcements').push({
                text: text,
                type: type,
                img: img || null,
                date: dateString
            }).then(() => {
                Swal.fire('โพสต์ข่าวสารสำเร็จ!', '', 'success');
                document.getElementById('news-text').value = '';
                document.getElementById('news-img').value = '';
            });
        }

        // 🎯 ฟังก์ชันสำหรับ "ลบ" ประกาศข่าวสาร (ที่เพิ่มเข้ามาใหม่)
        function deleteAnnouncement(key) {
            Swal.fire({
                title: 'ยืนยันที่จะลบประกาศนี้ใช่ไหม?',
                text: "ลบแล้วข้อมูลในหน้าลูกค้าจะหายไปด้วยนะ",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'ใช่, ลบเลย!',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    database.ref(`announcements/${key}`).remove().then(() => {
                        Swal.fire('ลบประกาศเรียบร้อยแล้ว!', '', 'success');
                    });
                }
            });
        }

        // ดึงรายการประกาศมาแสดงในหน้าแอดมิน พร้อมปุ่มลบ
        database.ref('announcements').on('value', snapshot => {
            const data = snapshot.val();
            const listDiv = document.getElementById('admin-annancements-list');
            listDiv.innerHTML = '';
            
            if(!data) {
                listDiv.innerHTML = '<div style="color:#64748b; font-size:14px;">ยังไม่มีประกาศข่าวสารในระบบ</div>';
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const item = data[key];
                let typeText = item.type === 'promo' ? '🔥 โปรโมชัน' : (item.type === 'maintenance' ? '🛠️ ปิดปรับปรุง' : '📌 ทั่วไป');
                
                listDiv.innerHTML += `
                    <div class="announcement-list-item">
                        <div class="announcement-info">
                            <p class="announcement-text">${item.text}</p>
                            <span class="announcement-meta">${typeText} • 📅 ${item.date || 'ไม่ระบุเวลา'}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteAnnouncement('${key}')">ลบประกาศ</button>
                    </div>
                `;
            });
        });

        // ------------------ ระบบคิวเดิม ล็อกกลไกไว้ 100% ------------------
        function addQueue() {
            const name = document.getElementById('cust-name').value.trim();
            if(!name) { Swal.fire('กรุณากรอกชื่อลูกค้า', '', 'warning'); return; }
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
            
            database.ref('queues').push({ name: name, time: timeStr, status: 'pending' }).then(() => {
                Swal.fire('เพิ่มคิวสำเร็จ', '', 'success');
                document.getElementById('cust-name').value = '';
            });
        }

        function updateStatus(key, newStatus) {
            database.ref(`queues/${key}`).update({ status: newStatus });
        }

        function removeQueue(key) {
            Swal.fire({
                title: 'ลบคิวนี้ใช่ไหม?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'ลบ'
            }).then((r) => { if(r.isConfirmed) database.ref(`queues/${key}`).remove(); });
        }

        database.ref('queues').on('value', snapshot => {
            const data = snapshot.val();
            const box = document.getElementById('admin-queue-list');
            box.innerHTML = '';
            if(!data) { box.innerHTML = '<div>ยังไม่มีคิวลูกค้า</div>'; return; }
            
            Object.keys(data).forEach((key, index) => {
                let item = data[key];
                box.innerHTML += `
                    <div class="queue-item">
                        <div><strong>#${index+1} คุณ ${item.name}</strong> (${item.time})</div>
                        <div class="queue-actions">
                            <select class="select-status" onchange="updateStatus('${key}', this.value)">
                                <option value="pending" ${item.status==='pending'?'selected':''}>🟥 ยังไม่ทำ</option>
                                <option value="brief" ${item.status==='brief'?'selected':''}>🟫 รอบรีฟ</option>
                                <option value="paid" ${item.status==='paid'?'selected':''}>🟩 จ่ายเงินแล้ว</option>
                                <option value="working" ${item.status==='working'?'selected':''}>🟦 กำลังทำ</option>
                                <option value="done" ${item.status==='done'?'selected':''}>🩷 เสร็จแล้ว</option>
                            </select>
                            <button class="btn-delete" onclick="removeQueue('${key}')">ลบคิว</button>
                        </div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
