<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy.mkt - Admin Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;600;700&display=swap">
    <style>
        body { background-color: #F8F9FA; font-family: 'Kanit', sans-serif; color: #4A4A4A; margin: 0; padding: 20px 12px; }
        .container { max-width: 950px; margin: 0 auto; background: #FFFFFF; padding: 25px 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); }
        @media (min-width: 768px) { body { padding: 30px 20px; } .container { padding: 35px; } }
        .brand-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; gap: 10px; }
        .brand-logo { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; }
        h1 { font-family: 'Poppins', 'Kanit', sans-serif; color: #FF7E1F; font-size: 30px; font-weight: 700; margin: 0; }
        .admin-tag { background: #FF7E1F; color: #FFF; padding: 3px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-bottom: 30px; display: table; margin-left: auto; margin-right: auto; }
        .social-admin-panel { background: #F4F7FE; border: 1px solid #E2E8F0; padding: 15px; border-radius: 16px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; }
        .social-inputs-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 768px) { .social-inputs-grid { grid-template-columns: repeat(3, 1fr); } }
        .social-group { display: flex; flex-direction: column; gap: 4px; }
        .social-group label { font-size: 12px; font-weight: 600; color: #4A5568; }
        .social-group input { padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px; font-family: 'Kanit'; font-size: 13px; outline: none; }
        .btn-save-links { background: #4318FF; color: white; border: none; padding: 12px; border-radius: 10px; font-family: 'Kanit'; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .announce-admin-panel { background: #FFF2E8; border: 1px solid #FFE0CC; padding: 15px; border-radius: 16px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; }
        .announce-row { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        @media (min-width: 768px) { .announce-row { flex-direction: row; align-items: center; } }
        .announce-admin-panel input[type="text"], .announce-admin-panel select { width: 100%; padding: 12px 16px; border: 1px solid #DFE3E6; border-radius: 10px; font-family: 'Kanit', sans-serif; font-size: 14px; box-sizing: border-box; outline: none; }
        .file-upload-wrapper { display: flex; flex-direction: column; gap: 6px; background: white; border: 1px solid #DFE3E6; padding: 10px 12px; border-radius: 10px; flex: 1; box-sizing: border-box; }
        @media (min-width: 768px) { .file-upload-wrapper { flex-direction: row; align-items: center; gap: 10px; padding: 8px 12px; } .announce-admin-panel input[type="text"] { flex: 2; } .announce-admin-panel select { flex: 1; } }
        .img-preview { max-height: 45px; border-radius: 6px; display: none; object-fit: cover; }
        .btn-add-announce { background-color: #2ECC71; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 500; font-family: 'Kanit'; white-space: nowrap; transition: all 0.2s; }
        .active-announcements-list { margin-bottom: 30px; display: flex; flex-direction: column; gap: 10px; }
        .active-announce-item { background: #FAFAFA; border: 1px solid #ECEFF1; padding: 12px 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        @media (min-width: 768px) { .active-announce-item { flex-direction: row; align-items: center; padding: 12px 20px; } }
        .active-announce-item .text-part { font-size: 14px; color: #444; flex: 1; word-break: break-all; }
        .active-announce-item img { height: 40px; width: 60px; object-fit: cover; border-radius: 4px; }
        .btn-delete-announce { background-color: #FFEBEE; color: #C62828; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .queue-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 35px; background: #FAFAFA; padding: 15px; border-radius: 16px; border: 1px solid #ECEFF1; }
        .queue-form input { padding: 12px 16px; border-radius: 10px; border: 1px solid #DFE3E6; font-family: 'Kanit'; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; }
        .queue-form button { background-color: #FF7E1F; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 500; color: white; font-family: 'Kanit'; font-size: 14px; box-shadow: 0 4px 12px rgba(255, 126, 31, 0.2); }
        @media (min-width: 768px) { .queue-form { flex-direction: row; padding: 20px; } .queue-form input { flex: 1; } }
        .admin-grid { display: flex; flex-direction: column; gap: 12px; }
        .admin-card { background: #FFFFFF; border: 1px solid #ECEFF1; border-radius: 14px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
        @media (min-width: 768px) { .admin-card { grid-template-columns: 40px 1.5fr 1fr 1fr 1fr 70px; align-items: center; display: grid; } }
        .admin-num { font-weight: 600; background: #FFF2E8; color: #FF7E1F; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; }
        .customer-name-admin { font-size: 15px; font-weight: 600; color: #222; word-break: break-all; }
        .contact-link { color: #FF7E1F; text-decoration: none; font-weight: 500; background: #FFF2E8; padding: 8px 12px; border-radius: 8px; display: inline-block; text-align: center; font-size: 13px; width: 100%; box-sizing: border-box; }
        .status-select { font-family: 'Kanit'; padding: 10px; border-radius: 8px; border: 1px solid #DFE3E6; background-color: #FFF; cursor: pointer; outline: none; font-size: 13px; width: 100%; box-sizing: border-box; }
        .btn-delete { background-color: #FFEBEE; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #C62828; font-family: 'Kanit'; font-size: 13px; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <img class="brand-logo" src="gkibotlrgpwer.jfif">
            <h1>Tummy.mkt</h1>
        </div>
        <div class="admin-tag">ADMIN MANAGEMENT (ONLINE)</div>

        <div class="social-admin-panel">
            <div style="font-size: 14px; font-weight: 600; color: #4318FF;">🔗 ตั้งค่าลิงก์ช่องทางติดต่อ (หน้าบ้าน)</div>
            <div class="social-inputs-grid">
                <div class="social-group"><label>Facebook URL:</label><input type="text" id="link-fb-input"></div>
                <div class="social-group"><label>Line URL / LINE ID:</label><input type="text" id="link-line-input"></div>
                <div class="social-group"><label>Instagram URL:</label><input type="text" id="link-ig-input"></div>
            </div>
            <button class="btn-save-links" onclick="saveSocialLinks()">บันทึกข้อมูลลิงก์โซเชียล 💾</button>
        </div>
        
        <div class="announce-admin-panel">
            <div style="font-size: 14px; font-weight: 600; color: #FF7E1F;">✨ สร้างประกาศข่าวสารใหม่</div>
            <div class="announce-row">
                <input type="text" id="announce-text-input" placeholder="พิมพ์เนื้อหาข่าวสาร..." required>
                <select id="announce-type-input">
                    <option value="general">📌 หมวดหมู่: ทั่วไป</option>
                    <option value="promo">🔥 หมวดหมู่: โปรโมชัน</option>
                    <option value="maintenance">🛠️ หมวดหมู่: ปิดปรับปรุง</option>
                </select>
            </div>
            <div class="announce-row">
                <div class="file-upload-wrapper">
                    <label>🖼️ รูปแบนเนอร์ด้านล่างการ์ด (ไม่เกิน 2MB): </label>
                    <input type="file" id="announce-file-input" accept="image/*" onchange="previewAnnounceImg(this)">
                </div>
                <img id="panel-preview" class="img-preview" src="">
                <button class="btn-add-announce" onclick="addAnnouncement()">บันทึกและโพสต์ประกาศ 🚀</button>
            </div>
        </div>

        <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color:#666;">📢 รายการประกาศปัจจุบันบนหน้าเว็บ:</div>
        <div class="active-announcements-list" id="active-announcements-box"></div>

        <form class="queue-form" onsubmit="handleFormSubmit(event)">
            <input type="text" id="customer-name" placeholder="ชื่อลูกค้า" required>
            <input type="text" id="customer-contact" placeholder="ช่องทางติดต่อ (ลิงก์/ไลน์ไอดี)" required>
            <button type="submit">เพิ่มคิว</button>
        </form>

        <div class="admin-grid" id="admin-queue-box"></div>
    </div>

    <script>
        // 🔗 เชื่อมต่อกับคลังข้อมูลออนไลน์ของคุณเรียบร้อยแล้วครับ
        const FIREBASE_BASE_URL = "https://tummy-queue-default-rtdb.firebaseio.com/";

        let tempImgBase64 = "";

        function loadAllData() {
            if(FIREBASE_BASE_URL.includes("ใส่ URL")) return;

            fetch(`${FIREBASE_BASE_URL}/social_links.json`).then(r => r.json()).then(links => {
                if(links){
                    document.getElementById('link-fb-input').value = links.fb === '#' ? '' : links.fb;
                    document.getElementById('link-line-input').value = links.line === '#' ? '' : links.line;
                    document.getElementById('link-ig-input').value = links.ig === '#' ? '' : links.ig;
                }
            });

            fetch(`${FIREBASE_BASE_URL}/announcements.json`).then(r => r.json()).then(data => {
                const box = document.getElementById('active-announcements-box'); box.innerHTML = '';
                if(!data) return;
                Object.keys(data).forEach(key => {
                    let item = data[key];
                    let imgTag = item.img ? `<img src="${item.img}">` : '<span style="color:#aaa; font-size:12px;">(ไม่มีรูป)</span>';
                    box.innerHTML += `
                        <div class="active-announce-item">
                            <div class="text-part"><strong>[${item.type}]</strong> 💬 ${item.text}</div>
                            <div style="display:flex; align-items:center; gap:10px; width:100%; justify-content:space-between; margin-top:5px;">
                                ${imgTag} <button class="btn-delete-announce" onclick="deleteAnnouncement('${key}')">ลบ 🗑️</button>
                            </div>
                        </div>`;
                });
            });

            fetch(`${FIREBASE_BASE_URL}/queues.json`).then(r => r.json()).then(data => {
                const box = document.getElementById('admin-queue-box'); box.innerHTML = '';
                if (!data) return;
                Object.keys(data).forEach((key, index) => {
                    let item = data[key];
                    let cLink = item.contact.startsWith('http') ? item.contact : `https://line.me/R/ti/p/~${item.contact}`;
                    box.innerHTML += `
                        <div class="admin-card">
                            <div style="display:flex; align-items:center; gap:10px;"><div class="admin-num">${index + 1}</div><div class="customer-name-admin">${item.name}</div></div>
                            <div><a href="${cLink}" target="_blank" class="contact-link">📱 ติดต่อ</a></div>
                            <div style="font-size:12px; color:#888;">🕒 ${item.time}</div>
                            <div>
                                <select class="status-select" onchange="updateStatus('${key}', this.value)">
                                    <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>ยังไม่ได้ทำ 🟥</option>
                                    <option value="paid" ${item.status === 'paid' ? 'selected' : ''}>จ่ายเงินแล้ว 🟩</option>
                                    <option value="brief" ${item.status === 'brief' ? 'selected' : ''}>รอบรีฟ 🟫</option>
                                    <option value="working" ${item.status === 'working' ? 'selected' : ''}>กำลังทำ 🟦</option>
                                    <option value="done" ${item.status === 'done' ? 'selected' : ''}>เสร็จแล้ว 🩷</option>
                                </select>
                            </div>
                            <div><button onclick="deleteQueue('${key}')" class="btn-delete">ลบ</button></div>
                        </div>`;
                });
            });
        }

        function saveSocialLinks() {
            let lineVal = document.getElementById('link-line-input').value.trim();
            if(lineVal && !lineVal.startsWith('http')) lineVal = `https://line.me/R/ti/p/~${lineVal}`;
            const links = { fb: document.getElementById('link-fb-input').value.trim() || '#', line: lineVal || '#', ig: document.getElementById('link-ig-input').value.trim() || '#' };
            
            fetch(`${FIREBASE_BASE_URL}/social_links.json`, { method: 'PUT', body: JSON.stringify(links) }).then(() => {
                alert("บันทึกลิงก์ขึ้นระบบออนไลน์เรียบร้อยแล้วจ้า! 🎉"); loadAllData();
            });
        }

        function previewAnnounceImg(input) {
            const file = input.files[0];
            if (file) {
                if (file.size > 2097152) { alert("⚠️ ขนาดไฟล์รูปใหญ่เกิน 2MB!"); input.value = ""; return; }
                const reader = new FileReader();
                reader.onload = function(e) { tempImgBase64 = e.target.result; const preview = document.getElementById('panel-preview'); preview.src = tempImgBase64; preview.style.display = 'block'; }
                reader.readAsDataURL(file);
            }
        }

        function addAnnouncement() {
            const textInput = document.getElementById('announce-text-input');
            const typeInput = document.getElementById('announce-type-input');
            if (!textInput.value.trim()) { alert("กรุณากรอกข้อความประกาศด้วยจ้า"); return; }
            const todayStr = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
            const newAnnounce = { text: textInput.value, type: typeInput.value, img: tempImgBase64, date: todayStr };

            fetch(`${FIREBASE_BASE_URL}/announcements.json`, { method: 'POST', body: JSON.stringify(newAnnounce) }).then(() => {
                textInput.value = ''; tempImgBase64 = ''; document.getElementById('announce-file-input').value = ''; document.getElementById('panel-preview').style.display = 'none';
                alert("โพสต์ออนไลน์เรียบร้อย! 🎉"); loadAllData();
            });
        }

        function deleteAnnouncement(key) {
            if(confirm('ต้องการลบประกาศนี้ใช่ไหม?')) {
                fetch(`${FIREBASE_BASE_URL}/announcements/${key}.json`, { method: 'DELETE' }).then(() => loadAllData());
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const nameInput = document.getElementById('customer-name');
            const contactInput = document.getElementById('customer-contact');
            const newQueue = { name: nameInput.value, contact: contactInput.value, time: new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }), status: 'pending' };

            fetch(`${FIREBASE_BASE_URL}/queues.json`, { method: 'POST', body: JSON.stringify(newQueue) }).then(() => {
                nameInput.value = ''; contactInput.value = ''; loadAllData();
            });
        }

        function updateStatus(key, newStatus) {
            fetch(`${FIREBASE_BASE_URL}/queues/${key}/status.json`, { method: 'PUT', body: JSON.stringify(newStatus) }).then(() => loadAllData());
        }

        function deleteQueue(key) {
            if(confirm('ต้องการลบคิวนี้ใช่ไหม?')) {
                fetch(`${FIREBASE_BASE_URL}/queues/${key}.json`, { method: 'DELETE' }).then(() => loadAllData());
            }
        }

        loadAllData();
        setInterval(loadAllData, 4000); // หน้าแอดมินดึงข้อมูลใหม่มาแสดงทุก 4 วินาทีอัตโนมัติ
    </script>
</body>
</html>
